  <text x="500" y="64" text-anchor="middle" font-size="32" font-weight="800" letter-spacing="6" fill="url(#tg)">FEATURED PROJECTS</text>
  <rect x="50" y="48" width="196" height="2" rx="1" fill="url(#lL)"/>
  <rect x="754" y="48" width="196" height="2" rx="1" fill="url(#lR)"/>
  <rect x="242" y="45" width="8" height="8" fill="#a855f7" transform="rotate(45 246 49)"/>
  <rect x="750" y="45" width="8" height="8" fill="#3b82f6" transform="rotate(45 754 49)"/>
