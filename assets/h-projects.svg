  <circle cy="49" r="2" fill="#fff"><animate attributeName="cx" values="50;246" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.8;1" dur="3s" repeatCount="indefinite"/></circle>
